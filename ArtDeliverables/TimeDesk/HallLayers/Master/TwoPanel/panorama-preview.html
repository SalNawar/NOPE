<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Hall panorama — registration preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#191b20;color:#eee;font:14px system-ui}header{height:68px;padding:16px 24px;display:flex;gap:16px;align-items:center}button{padding:8px 14px;background:#30343e;border:1px solid #616879;border-radius:5px;color:#fff;cursor:pointer}input{flex:1;min-width:60px}#view{width:min(100vw,calc((100vh - 68px) * 3));height:auto;aspect-ratio:3;margin:0 auto;position:relative;overflow:hidden;background:#303841}#strip{position:absolute;height:100%}.panel{position:absolute;top:0;height:100%;overflow:hidden}.panel img{position:absolute;display:block;max-width:none;width:100%;height:100%}#seam{position:absolute;top:0;width:1px;height:100%;background:#eaa553;opacity:0;pointer-events:none}body.guides #seam{opacity:.8}body.native #view{width:100%;height:724px;aspect-ratio:auto}#label{white-space:nowrap}
</style>
<header><button onclick="focusPanel('city')">City</button><button onclick="focusPanel('join')">Join</button><button onclick="focusPanel('hall')">Hall</button><input aria-label="Pan" id="pan" type="range" min="0" max="1" step=".001" value=".5"><button onclick="document.body.classList.toggle('guides')">Seam guide</button><button onclick="document.body.classList.toggle('native');update();focusPanel('hall')">100% detail</button><span id="label">Perspective study</span></header>
<div id="view"><div id="strip"><div id="city" class="panel"><img src="left-city-v2-neutral.png"></div><div id="hall" class="panel"><img src="right-hall-v2-neutral.png"></div><div id="seam"></div></div></div>
<script>
const strip=document.querySelector('#strip'),view=document.querySelector('#view'),pan=document.querySelector('#pan'),city=document.querySelector('#city'),hall=document.querySelector('#hall');
const geometry={height:724,cityWidth:2390,hallWidth:2172,cityScaleY:7/6,horizon:220};
function dimensions(){const scale=view.clientHeight/geometry.height;return {scale,left:geometry.cityWidth*scale,right:geometry.hallWidth*scale}}
function update(){const {scale,left,right}=dimensions(),total=left+right;strip.style.width=total+'px';city.style.width=left+'px';city.style.left='0';const ci=city.querySelector('img');ci.style.height=(geometry.cityScaleY*100)+'%';ci.style.top=((1-geometry.cityScaleY)*geometry.horizon*scale)+'px';hall.style.left=left+'px';hall.style.width=right+'px';document.querySelector('#seam').style.left=left+'px';const offset=-Math.max(0,total-view.clientWidth)*Number(pan.value);strip.style.transform='translateX('+(document.body.classList.contains('native')?Math.round(offset):offset)+'px)'}
function focusPanel(which){const {left,right}=dimensions(),total=left+right,center=which==='city'?left/2:which==='hall'?left+right/2:left;pan.value=Math.max(0,Math.min(1,(center-view.clientWidth/2)/(total-view.clientWidth)));update()}
pan.oninput=update;onresize=update;if(location.search.includes('capture')){document.querySelector('header').style.display='none';view.style.width='100vw';view.style.height='100vh';view.style.aspectRatio='auto'}update();focusPanel('join');
</script></html>
