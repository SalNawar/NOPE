<text x="300.00" y="688.00" font-family="Arial, sans-serif" font-size="10" fill="#726B70" font-weight="400" text-anchor="middle">
<tspan x="300.00" dy="0">CONTROLLED STAIR</tspan>
</text>
<text x="1050.00" y="234.00" font-family="Arial, sans-serif" font-size="22" fill="#302D33" font-weight="700" text-anchor="start">
<tspan x="1050.00" dy="0">WHY THIS FITS THE VISION</tspan>
</text>
<text x="1050.00" y="274.00" font-family="Arial, sans-serif" font-size="20" fill="#726B70" font-weight="400" text-anchor="start">
<tspan x="1050.00" dy="0">The booth is a small administrative threshold</tspan>
<tspan x="1050.00" dy="27.0">inside a vast transport system. Beyond it,</tspan>
<tspan x="1050.00" dy="27.0">people are sorted onto numbered platforms</tspan>
<tspan x="1050.00" dy="27.0">and disappear into departures for the past.</tspan>
</text>
<text x="1050.00" y="410.00" font-family="Arial, sans-serif" font-size="19" fill="#302D33" font-weight="700" text-anchor="start">
<tspan x="1050.00" dy="0">VISIBILITY CHECKS</tspan>
</text>
<text x="1050.00" y="447.00" font-family="Arial, sans-serif" font-size="17" fill="#726B70" font-weight="400" text-anchor="start">
<tspan x="1050.00" dy="0">Straight desk and forward viewing axis.</tspan>
<tspan x="1050.00" dy="22.950000000000003">The inspection floor stays at the current datum.</tspan>
<tspan x="1050.00" dy="22.950000000000003">An early deck edge allows a view down to Platform 01.</tspan>
<tspan x="1050.00" dy="22.950000000000003">The guard must be transparent, not an opaque wall.</tspan>
<tspan x="1050.00" dy="22.950000000000003">Upper portals sit beyond the low booth screen.</tspan>
</text>
<text x="1050.00" y="598.00" font-family="Arial, sans-serif" font-size="18" fill="#302D33" font-weight="700" text-anchor="start">
<tspan x="1050.00" dy="0">NOT YET IMPLEMENTED</tspan>
</text>
<text x="1050.00" y="632.00" font-family="Arial, sans-serif" font-size="17" fill="#726B70" font-weight="400" text-anchor="start">
<tspan x="1050.00" dy="0">Camera controls, visitor anchors and interaction</tspan>
<tspan x="1050.00" dy="22.950000000000003">remain gameplay-owned. These are spatial drawings;</tspan>
<tspan x="1050.00" dy="22.950000000000003">full perspective and pan checks come in the blockout.</tspan>
</text>
