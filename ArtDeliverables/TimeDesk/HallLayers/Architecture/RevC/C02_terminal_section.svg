<tspan x="470.00" dy="0">LEFT</tspan>
</text>
<text x="470.00" y="878.00" font-family="Arial, sans-serif" font-size="16" fill="#726B70" font-weight="400" text-anchor="start">
<tspan x="470.00" dy="0">Clear side bay → city glazing.</tspan>
<tspan x="470.00" dy="21.6">No neighbouring workstation on this side.</tspan>
</text>
<text x="470.00" y="966.00" font-family="Arial, sans-serif" font-size="15" fill="#302D33" font-weight="700" text-anchor="start">
<tspan x="470.00" dy="0">RIGHT + REAR</tspan>
</text>
<text x="470.00" y="994.00" font-family="Arial, sans-serif" font-size="16" fill="#726B70" font-weight="400" text-anchor="start">
<tspan x="470.00" dy="0">Opaque return and enclosed staff rooms.</tspan>
<tspan x="470.00" dy="21.6">Hidden work areas stay outside the public view.</tspan>
</text>
<text x="1030.00" y="803.00" font-family="Arial, sans-serif" font-size="20" fill="#302D33" font-weight="700" text-anchor="start">
<tspan x="1030.00" dy="0">THE ARCHITECTURAL CHARACTER</tspan>
</text>
<text x="1030.00" y="841.00" font-family="Arial, sans-serif" font-size="18" fill="#726B70" font-weight="400" text-anchor="start">
<tspan x="1030.00" dy="0">A grand train terminal translated into time travel:</tspan>
<tspan x="1030.00" dy="24.3">platform numbers, departure boards, galleries,</tspan>
<tspan x="1030.00" dy="24.3">controlled boarding, luggage storage and long views.</tspan>
<tspan x="1030.00" dy="24.3"></tspan>
<tspan x="1030.00" dy="24.3">State grandeur above; ordinary lives processed below.</tspan>
<tspan x="1030.00" dy="24.3">One painting and a few neglected artifacts are details</tspan>
<tspan x="1030.00" dy="24.3">within that system, rather than the subject of the hall.</tspan>
</text>
<line x1="55.00" y1="1172.00" x2="1745.00" y2="1172.00" stroke="#D8D0C4" stroke-width="1.5"/>
<text x="55.00" y="1200.00" font-family="Arial, sans-serif" font-size="14" fill="#726B70" font-weight="400" text-anchor="start">
<tspan x="55.00" dy="0">Section is schematic: side galleries are projected, not all on one cut line. No furniture or game scene is changed.</tspan>
</text>
<text x="1745.00" y="1200.00" font-family="Arial, sans-serif" font-size="14" fill="#726B70" font-weight="400" text-anchor="end">
<tspan x="1745.00" dy="0">26 SEP 2026  /  REV C  /  PROPOSAL</tspan>
</text>
