<tspan x="464.10" dy="0">~7 m shortest distance to glazing</tspan>
</text>
<text x="645.00" y="904.00" font-family="Arial, sans-serif" font-size="13" fill="#302D33" font-weight="700" text-anchor="middle">
<tspan x="645.00" dy="0">PLAYER / WINDOW-END STATION</tspan>
</text>
<text x="410.00" y="1094.00" font-family="Arial, sans-serif" font-size="13" fill="#726B70" font-weight="400" text-anchor="start">
<tspan x="410.00" dy="0">Pan ray projected into this section; actual view is oblique.</tspan>
</text>
<text x="65.00" y="824.00" font-family="Arial, sans-serif" font-size="14" fill="#726B70" font-weight="400" text-anchor="start">
<tspan x="65.00" dy="0">CITY FAR BELOW</tspan>
<tspan x="65.00" dy="18.900000000000002">Building height not fixed</tspan>
</text>
<text x="1010.00" y="727.00" font-family="Arial, sans-serif" font-size="21" fill="#302D33" font-weight="700" text-anchor="start">
<tspan x="1010.00" dy="0">WHAT THE PAN CHANGES</tspan>
</text>
<text x="1010.00" y="766.00" font-family="Arial, sans-serif" font-size="18" fill="#726B70" font-weight="400" text-anchor="start">
<tspan x="1010.00" dy="0">Use real depth for window reveals, piers, desk and nearby props.</tspan>
<tspan x="1010.00" dy="24.3">A flat front-facing hall painting would break when viewed sideways.</tspan>
<tspan x="1010.00" dy="24.3">Distant city layers, mounted pictures and distant crowds can still</tspan>
<tspan x="1010.00" dy="24.3">use sprites where their angle and depth remain believable.</tspan>
</text>
<text x="1010.00" y="907.00" font-family="Arial, sans-serif" font-size="19" fill="#302D33" font-weight="700" text-anchor="start">
<tspan x="1010.00" dy="0">NEXT SANITY CHECK</tspan>
</text>
<text x="1010.00" y="943.00" font-family="Arial, sans-serif" font-size="18" fill="#726B70" font-weight="400" text-anchor="start">
<tspan x="1010.00" dy="0">Build one plain spatial model and inspect both camera views.</tspan>
<tspan x="1010.00" dy="24.3">Test the corkboards and partitions across the entire pan.</tspan>
<tspan x="1010.00" dy="24.3">The portal gets smaller at this greater viewing distance.</tspan>
<tspan x="1010.00" dy="24.3">Keep the actual pan controls and interaction rules with Claude.</tspan>
</text>
<line x1="55.00" y1="1172.00" x2="1745.00" y2="1172.00" stroke="#D8D0C4" stroke-width="1.5"/>
<text x="55.00" y="1200.00" font-family="Arial, sans-serif" font-size="14" fill="#726B70" font-weight="400" text-anchor="start">
<tspan x="55.00" dy="0">Perspective framing, interaction preservation and the pan range are unresolved until the shared-camera blockout.</tspan>
</text>
<text x="1745.00" y="1200.00" font-family="Arial, sans-serif" font-size="14" fill="#726B70" font-weight="400" text-anchor="end">
<tspan x="1745.00" dy="0">26 SEP 2026  /  REV B  /  PROPOSAL</tspan>
</text>
