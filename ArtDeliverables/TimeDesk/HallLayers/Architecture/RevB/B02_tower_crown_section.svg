<tspan x="530.00" dy="0">PORTAL</tspan>
<tspan x="530.00" dy="17.55">6 m source scale</tspan>
</text>
<text x="270.00" y="581.00" font-family="Arial, sans-serif" font-size="12" fill="#726B70" font-weight="400" text-anchor="middle">
<tspan x="270.00" dy="0">HUMANS ≈ 1.75 m</tspan>
<tspan x="270.00" dy="16.200000000000003">FURNITURE NOT ENLARGED</tspan>
</text>
<text x="720.00" y="581.00" font-family="Arial, sans-serif" font-size="12" fill="#726B70" font-weight="400" text-anchor="middle">
<tspan x="720.00" dy="0">SOURCE PORTAL SIZE RETAINED IN STUDY</tspan>
<tspan x="720.00" dy="16.200000000000003">Framing needs a perspective check</tspan>
</text>
<text x="520.00" y="358.00" font-family="Arial, sans-serif" font-size="22" fill="#302D33" font-weight="700" text-anchor="middle">
<tspan x="520.00" dy="0">The room dwarfs its occupants.</tspan>
</text>
<text x="520.00" y="398.00" font-family="Arial, sans-serif" font-size="15" fill="#726B70" font-weight="400" text-anchor="middle">
<tspan x="520.00" dy="0">Tall piers, long bays, deep reveals and uninterrupted glazing.</tspan>
</text>
<text x="1100.00" y="238.00" font-family="Arial, sans-serif" font-size="20" fill="#302D33" font-weight="700" text-anchor="start">
<tspan x="1100.00" dy="0">THE UPPER CROWN OF A GOVERNMENT TOWER</tspan>
</text>
<text x="1100.00" y="274.00" font-family="Arial, sans-serif" font-size="18" fill="#726B70" font-weight="400" text-anchor="start">
<tspan x="1100.00" dy="0">The hall occupies the upper civic crown.</tspan>
<tspan x="1100.00" dy="24.3">Public lifts travel up from admissions far below.</tspan>
<tspan x="1100.00" dy="24.3">The tower’s exact height and floor number remain open.</tspan>
<tspan x="1100.00" dy="24.3">C-SUITES branches into the controlled upper core.</tspan>
</text>
<text x="1100.00" y="407.00" font-family="Arial, sans-serif" font-size="18" fill="#302D33" font-weight="700" text-anchor="start">
<tspan x="1100.00" dy="0">THE CITY VIEW NEEDS VERTICAL DEPTH</tspan>
</text>
<text x="1100.00" y="440.00" font-family="Arial, sans-serif" font-size="18" fill="#726B70" font-weight="400" text-anchor="start">
<tspan x="1100.00" dy="0">Show roofs and occupied levels below, distant towers,</tspan>
<tspan x="1100.00" dy="24.3">and several layers of city massing. It should feel like</tspan>
<tspan x="1100.00" dy="24.3">looking out from the institution above the city.</tspan>
</text>
<line x1="55.00" y1="660.00" x2="1745.00" y2="660.00" stroke="#D8D0C4" stroke-width="1.5"/>
<text x="65.00" y="703.00" font-family="Arial, sans-serif" font-size="23" fill="#302D33" font-weight="700" text-anchor="start">
<tspan x="65.00" dy="0">LEFT VIEW  /  LOCAL TRANSVERSE SECTION</tspan>
</text>
<text x="65.00" y="733.00" font-family="Arial, sans-serif" font-size="15" fill="#726B70" font-weight="400" text-anchor="start">
<tspan x="65.00" dy="0">Diagrammatic: the tower / city is context, not a final skyline design.</tspan>
</text>
